name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check app tools tests 01_cidr.py 02_tcp_echo.py
      - run: python -m pytest -q
      - run: docker compose config
      - name: Start isolated Redis failover pair
        run: docker compose --profile redis-failover up -d --wait redis_fault_primary redis_fault_replica
      - name: Exercise stale-replica promotion boundary
        id: failover_drill
        run: >-
          python -m tools.redis_failover_drill
          --primary-url redis://127.0.0.1:16379/0
          --replica-url redis://127.0.0.1:16380/0
          --receipt "${RUNNER_TEMP}/redis-failover-receipt.json"
      - name: Archive failover evidence
        if: ${{ always() && (steps.failover_drill.outcome == 'success' || steps.failover_drill.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redis-failover-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/redis-failover-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop isolated Redis failover pair
        if: always()
        run: docker compose --profile redis-failover down --volumes
      - name: Start isolated three-Sentinel election topology
        run: >-
          docker compose --profile redis-sentinel-election up -d --wait
          redis_election_primary redis_election_replica
          redis_election_sentinel_a redis_election_sentinel_b redis_election_sentinel_c
      - name: Exercise Sentinel election, one-way partition, and healing
        id: sentinel_election_drill
        run: >-
          python -m tools.redis_sentinel_election_drill
          --primary-url redis://127.0.0.1:16479/0
          --candidate-url redis://127.0.0.1:16480/0
          --sentinel-url redis://127.0.0.1:26479/0
          --sentinel-url redis://127.0.0.1:26480/0
          --sentinel-url redis://127.0.0.1:26481/0
          --candidate-advertised-host 172.30.0.11
          --candidate-advertised-port 6379
          --partition-peer 172.30.0.11
          --partition-peer 172.30.0.21
          --partition-peer 172.30.0.22
          --partition-peer 172.30.0.23
          --receipt "${RUNNER_TEMP}/redis-sentinel-election-receipt.json"
          --timeout-seconds 30
      - name: Archive Sentinel election evidence
        if: ${{ always() && (steps.sentinel_election_drill.outcome == 'success' || steps.sentinel_election_drill.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redis-sentinel-election-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/redis-sentinel-election-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Report Sentinel election diagnostics
        if: failure()
        run: >-
          docker compose --profile redis-sentinel-election logs --no-color --tail 200
          redis_election_primary redis_election_replica
          redis_election_sentinel_a redis_election_sentinel_b redis_election_sentinel_c
      - name: Stop isolated three-Sentinel election topology
        if: always()
        run: docker compose --profile redis-sentinel-election down --volumes
      - run: docker build -t cloud-networking-lab:test .

