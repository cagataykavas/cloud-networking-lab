name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check app tools tests 01_cidr.py 02_tcp_echo.py
      - run: pytest -q
      - run: docker compose config
      - run: docker build -t cloud-networking-lab:test .
