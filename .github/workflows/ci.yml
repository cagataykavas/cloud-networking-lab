name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check app tools tests 01_cidr.py 02_tcp_echo.py
      - run: python -m pytest -q
      - run: docker compose config
      - name: Audit edge/private network segmentation
        run: |
          docker compose config --format json > /tmp/compose.json
          python tools/topology_audit.py /tmp/compose.json \
            --backend-service backend_a \
            --backend-service backend_b
      - run: docker build -t cloud-networking-lab:test .
