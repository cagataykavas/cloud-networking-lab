services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend_a:
        condition: service_healthy
      backend_b:
        condition: service_healthy
    networks:
      - edge
      - private_app

  backend_a:
    build: .
    environment:
      INSTANCE_ID: backend-a
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=1)"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      private_app:
        ipv4_address: 172.29.0.11

  backend_b:
    build: .
    environment:
      INSTANCE_ID: backend-b
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=1)"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      private_app:
        ipv4_address: 172.29.0.12

  redis_fault_primary:
    image: redis:8.2.10-alpine
    profiles: ["redis-failover"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 20
    networks:
      - redis_fault_lab

  redis_fault_replica:
    image: redis:8.2.10-alpine
    profiles: ["redis-failover"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "no", "--replicaof", "redis_fault_primary", "6379"]
    ports:
      - "127.0.0.1:16380:6379"
    depends_on:
      redis_fault_primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 20
    networks:
      - redis_fault_lab

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  private_app:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  redis_fault_lab:
    driver: bridge
